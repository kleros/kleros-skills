name: Sync master from dev

on:
  push:
    tags:
      - "*@v*.*.*"   # skill release tags: kleros-curate@v1.0.0, kleros-ipfs-upload@v1.1.0
      - "v[0-9]*"    # repo-level/whole-plugin releases: v1.2.0 (REV-05: digit-anchored to skip vNext, vendor-*, etc.)
  workflow_dispatch:   # manual override for hotfixes / initial dry-run (gated by production-sync Environment)

# Principle of least privilege for the implicit GITHUB_TOKEN.
# The actual master push uses the GitHub App token minted below — this block
# only restricts what the workflow's auto-injected GITHUB_TOKEN can do.
permissions:
  contents: read

# Never drop a running sync — queue the next one instead.
concurrency:
  group: sync-master
  cancel-in-progress: false

# Single source of truth for what never reaches master. Read by `sync` (the
# strip itself) and by `quality-gate` (the already-synced check, which must
# reproduce the strip exactly to compare trees). Not secrets.
#   STRIP_PATHS        — removed recursively wherever they sit (whitespace-separated)
#   STRIP_ROOT_PATTERN — root-level scratch markdown, matched against `git ls-files`
env:
  STRIP_PATHS: .planning test scripts package.json yarn.lock .yarnrc.yml RELEASING.md
  STRIP_ROOT_PATTERN: '^[^/]*FEEDBACK[^/]*\.md$|^HANDOVER[^/]*\.md$'

jobs:
  # =========================================================================
  # Job 1 — quality gate. Runs everything that executes repo or third-party
  # code (npm install hooks, tsx/viem/@x402/cdp-sdk loaded by the tests).
  # Token-less by design: no GitHub App token, no protected Environment,
  # read-only GITHUB_TOKEN that is NOT persisted to .git/config. Nothing
  # this job runs can reach a credential that pushes master.
  #
  # It resolves the commit to release ONCE and hands that SHA to `sync`, so
  # the job that pushes master strips exactly the commit tested here:
  #   tag push          → the TAGGED commit (must be on dev). Commits landing
  #                       on dev after tagging never ship under the tag.
  #   workflow_dispatch → dev HEAD at run time (deliberate manual re-sync).
  # =========================================================================
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # hard cap; default is 6h — refuse to silently burn budget
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      already_synced: ${{ steps.synced.outputs.already_synced }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the commit to release: the tagged commit on a tag push
      #    (github.sha — for tag pushes GitHub sets it to the commit the tag
      #    points at), dev HEAD on workflow_dispatch. Full history (repo is a
      #    few MB) also fetches refs/remotes/origin/dev and origin/master, so
      #    the dev-ancestry and already-synced checks need no extra fetch.
      #    persist-credentials: false — GITHUB_TOKEN is used for this fetch
      #    only and never written to .git/config where test code could read it.
      # -----------------------------------------------------------------------
      - name: Checkout commit to release
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v6.0.3
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'dev' }}
          fetch-depth: 0
          persist-credentials: false

      # Pin the commit under test. `sync` checks out this SHA and asserts it,
      # so nothing landing on dev between (or during) the two jobs can ship
      # untested code. On a tag push it must be the tagged commit itself.
      - name: Resolve commit under test
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.sha }}
          TRIGGER_REF: ${{ github.ref_name }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = "push" ] && [ "$SHA" != "$TRIGGER_SHA" ]; then
            echo "FATAL: checked out $SHA, but tag $TRIGGER_REF points at $TRIGGER_SHA."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Commit under test: $SHA"

      # -----------------------------------------------------------------------
      # REV-03: Tag ancestry check.
      # The tagged commit must be on dev (ancestor of, or equal to, origin/dev)
      # before anything else runs. Closes the privilege-amplification vector
      # where a contributor pushes a tag at an arbitrary (e.g. malicious,
      # never-reviewed) commit. Fails here, before any third-party code and
      # before the reviewer is asked to approve; `sync` re-asserts it.
      #
      # github.sha is a 40-char hex hash from GitHub itself (not user-controllable
      # text), so direct interpolation in `run:` is safe. The env-var pattern is
      # used anyway as defensive coding consistent with the workflow's other steps.
      #
      # Skipped for workflow_dispatch — that path checks out dev itself and is
      # gated by the Environment required-reviewers check (REV-07).
      # -----------------------------------------------------------------------
      - name: Verify tagged commit is on dev
        if: github.event_name == 'push'
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          TRIGGER_REF: ${{ github.ref_name }}
        run: |
          git rev-parse --verify --quiet refs/remotes/origin/dev >/dev/null || {
            echo "FATAL: origin/dev not fetched — cannot verify dev ancestry."
            exit 1
          }
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/dev; then
            echo "ERROR: tag $TRIGGER_REF (commit $SHA) is not on dev's history."
            echo "       Refusing to sync master — release tags must point to"
            echo "       commits on dev."
            exit 1
          fi
          echo "OK: $TRIGGER_REF ($SHA) is on dev ancestry."

      # -----------------------------------------------------------------------
      # Already-synced check. A release often pushes several tags at the same
      # commit (`vX.Y.Z` + `skillname@vX.Y.Z`); each fires its own run, but only
      # the first has anything to publish. Likewise a tag pushed late, on a
      # commit older than the one master was last synced from, has nothing to
      # add (and `sync`'s rollback guard would refuse it). With T = the commit
      # under test and P = master's parent (the dev commit master was synced
      # from), `already_synced=true` iff master is a single-parent sync commit,
      # T is an ancestor of (or equal to) P, AND master's tree equals a fresh
      # strip of P. `sync` then skips, so no approval is requested and the run
      # ends green with a summary saying why.
      #
      # Fail-safe: anything else (dispatch, no master yet, T newer than or
      # unrelated to P, tree drift from a manual push or strip-list change)
      # yields `false` and the normal gated sync. A wrongly-true flag can only
      # withhold a sync, never ship one. Runs before any third-party code. The
      # strip is replayed on a throwaway index, so the working tree under test
      # is untouched. workflow_dispatch never skips: a manual run is a
      # deliberate re-sync.
      # -----------------------------------------------------------------------
      - name: Check whether master already has this commit
        id: synced
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.ref_name }}
        run: |
          SYNCED=false
          if [ "$EVENT_NAME" != "push" ]; then
            echo "Manual run: always sync."
          elif ! MASTER=$(git rev-parse --verify --quiet 'refs/remotes/origin/master^{commit}'); then
            echo "No origin/master yet: first sync."
          else
            read -r -a COMMIT_AND_PARENTS <<< "$(git rev-list --parents -n 1 "$MASTER")"
            PARENT="${COMMIT_AND_PARENTS[1]:-}"
            if [ "${#COMMIT_AND_PARENTS[@]}" -eq 2 ] && \
               git merge-base --is-ancestor "$SHA" "$PARENT" 2>/dev/null; then
              EXPECTED_TREE=$(
                export GIT_INDEX_FILE="$RUNNER_TEMP/expected-master.index"
                read -r -a STRIP <<< "$STRIP_PATHS"
                git read-tree "$PARENT"
                git rm -r --cached --quiet --ignore-unmatch -- "${STRIP[@]}"
                git ls-files -z | { grep -zE "$STRIP_ROOT_PATTERN" || true; } | \
                  xargs -0 --no-run-if-empty git rm --cached --quiet --
                git write-tree
                rm -f "$GIT_INDEX_FILE"
              )
              MASTER_TREE=$(git rev-parse "$MASTER^{tree}")
              if [ "$EXPECTED_TREE" = "$MASTER_TREE" ]; then
                SYNCED=true
              else
                echo "master was synced from $PARENT but its tree ($MASTER_TREE)"
                echo "differs from a fresh strip ($EXPECTED_TREE): syncing again."
              fi
            else
              echo "master ($MASTER) was not synced from $SHA or a descendant: sync needed."
            fi
          fi
          echo "already_synced=$SYNCED" >> "$GITHUB_OUTPUT"
          if [ "$SYNCED" = true ]; then
            if [ "$PARENT" = "$SHA" ]; then
              STATE="master (\`${MASTER:0:7}\`) is already at commit \`${SHA:0:7}\`"
            else
              STATE="master (\`${MASTER:0:7}\`) is already ahead: synced from \`${PARENT:0:7}\`, which contains commit \`${SHA:0:7}\`"
            fi
            MSG="Nothing to sync for \`$TRIGGER_REF\`: $STATE, with the expected stripped tree. \`sync\` is skipped, so no approval is requested."
            echo "$MSG"
            echo "### Already synced" >> "$GITHUB_STEP_SUMMARY"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

      # -----------------------------------------------------------------------
      # 2. Set up Node for the quality gates.
      # -----------------------------------------------------------------------
      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v6.4.0
        with:
          node-version: "24"

      # -----------------------------------------------------------------------
      # 3. Quality gate — test suite must pass before `sync` may run.
      # -----------------------------------------------------------------------
      - name: Install skill helper deps (tests exercise them)
        run: npm ci --prefix kleros-create-dispute/scripts

      # Payment-guard tests (test/ipfs-upload-payment-guard.test.js) run the
      # upload runner against the locked x402 SDK. --ignore-scripts: the tests
      # need no native builds, so skip third-party install hooks.
      - name: Install IPFS upload script deps (payment-guard tests)
        run: npm ci --ignore-scripts --prefix kleros-ipfs-upload/scripts

      - name: Quality gate — npm test
        run: npm test

      # -----------------------------------------------------------------------
      # 4. Quality gate — index.json digests must be fresh.
      #    Re-running update-digests and checking for a diff ensures no stale
      #    SHA-256 hashes ship to user machines.
      # -----------------------------------------------------------------------
      - name: Quality gate — digest freshness
        run: |
          node scripts/update-digests.js
          if ! git diff --quiet .well-known/agent-skills/index.json; then
            echo "ERROR: .well-known/agent-skills/index.json digests are stale."
            echo "Run 'npm run update-digests' locally and commit the result before tagging."
            exit 1
          fi

  # =========================================================================
  # Job 2 — sync. Strips the gate-tested commit and pushes it to master.
  # Runs no npm installs and no repo code: only git + shell, plus the two
  # SHA-pinned actions (checkout, create-github-app-token).
  # Starts only if quality-gate succeeded (explicit `success()`: a failed,
  # cancelled or skipped gate skips this job) AND master does not already
  # hold the tested commit or a descendant of it (see the already-synced
  # check). A job skipped by
  # `if:` never reaches the environment, so no approval is requested.
  # =========================================================================
  sync:
    needs: quality-gate
    if: success() && needs.quality-gate.outputs.already_synced != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # hard cap; default is 6h — refuse to silently burn budget
    permissions:
      contents: read

    # REV-07: gate the job on a protected Environment.
    # Configure `production-sync` in repo Settings → Environments with:
    #   - Required reviewers: org owners only (or named maintainers)
    #   - Deployment branches/tags: `dev` + the release-tag patterns (defense in depth)
    # workflow_dispatch then requires reviewer approval before the App token
    # is minted, closing the privilege-amplification vector for non-tag runs.
    # Because this job `needs: quality-gate`, the approval request only
    # appears once the gate has passed — the reviewer approves a tested commit.
    environment: production-sync

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the exact commit quality-gate tested. Full history fetches
      #    origin/dev (ancestry re-check) and origin/master (force-with-lease
      #    remote-tracking ref) with the read-only GITHUB_TOKEN; credentials are
      #    not persisted. A missing master (very first bootstrap) is tolerated.
      # -----------------------------------------------------------------------
      - name: Checkout tested commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v6.0.3
        with:
          ref: ${{ needs.quality-gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Re-assert, before any destructive step, that we hold the tested commit,
      # that it is still on dev (not rewritten away by a force-push between
      # jobs), and — for tag pushes — that it IS the tagged commit (REV-03).
      - name: Verify pinned commit
        env:
          TESTED_SHA: ${{ needs.quality-gate.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.sha }}
          TRIGGER_REF: ${{ github.ref_name }}
        run: |
          if ! [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: quality-gate did not output a commit SHA ('$TESTED_SHA')."
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$TESTED_SHA" ]; then
            echo "FATAL: checked out $HEAD_SHA, but quality-gate tested $TESTED_SHA."
            exit 1
          fi
          git rev-parse --verify --quiet refs/remotes/origin/dev >/dev/null || {
            echo "FATAL: origin/dev not fetched — cannot verify dev ancestry."
            exit 1
          }
          if ! git merge-base --is-ancestor "$TESTED_SHA" refs/remotes/origin/dev; then
            echo "FATAL: tested commit $TESTED_SHA is no longer on origin/dev."
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && [ "$TESTED_SHA" != "$TRIGGER_SHA" ]; then
            echo "FATAL: tag $TRIGGER_REF points at $TRIGGER_SHA, but quality-gate"
            echo "       tested $TESTED_SHA. A tag push publishes the tagged commit only."
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && \
             ! git merge-base --is-ancestor "$TRIGGER_SHA" "$TESTED_SHA"; then
            echo "FATAL: tag $TRIGGER_REF ($TRIGGER_SHA) is not on the ancestry"
            echo "       of the tested commit $TESTED_SHA."
            exit 1
          fi
          # Rollback guard: each master sync commit's first parent is the dev
          # commit it was synced from. Re-running an old run's sync job reuses
          # that run's (older) tested SHA — refuse to move master backwards.
          if PREV=$(git rev-parse --verify --quiet 'refs/remotes/origin/master^1'); then
            if [ "$PREV" != "$TESTED_SHA" ] && \
               git merge-base --is-ancestor "$TESTED_SHA" "$PREV"; then
              echo "FATAL: master was already synced from $PREV, a descendant of"
              echo "       $TESTED_SHA. Refusing to roll master back (stale re-run?)."
              exit 1
            fi
            # Tag pushes publish the tagged commit, not dev HEAD, so a tag on a
            # dev commit that does not contain $PREV (e.g. a merged PR branch's
            # own commit) would drop already-published changes. Tag pushes
            # only move master forward; workflow_dispatch (dev HEAD) is the
            # deliberate override.
            if [ "$EVENT_NAME" = "push" ] && \
               ! git merge-base --is-ancestor "$PREV" "$TESTED_SHA"; then
              echo "FATAL: master was synced from $PREV, which tag $TRIGGER_REF"
              echo "       ($TESTED_SHA) does not contain. Refusing to drop published"
              echo "       changes: tag a commit that contains it, or dispatch manually."
              exit 1
            fi
          fi
          echo "OK: syncing tested commit $TESTED_SHA (on origin/dev)."

      # -----------------------------------------------------------------------
      # 2. Strip dev-only files.
      #    Everything removed here will NOT appear on master or in plugin installs.
      #
      #    Strip-list (workflow-level env STRIP_PATHS / STRIP_ROOT_PATTERN —
      #    shared with quality-gate's already-synced check):
      #      .planning/        — GSD planning artefacts
      #      test/             — test suite + claude plugin eval suite (test/evals/)
      #      scripts/          — dev helper scripts
      #      package.json      — dev dependencies / npm scripts
      #      yarn.lock         — lockfile
      #      .yarnrc.yml       — Yarn config
      #      RELEASING.md      — maintainer release how-to
      #      *FEEDBACK*.md     — AI session feedback scratch files (root only)
      #      HANDOVER*.md      — Handover scratch files (root only)
      # -----------------------------------------------------------------------
      - name: Strip dev-only files
        run: |
          read -r -a STRIP <<< "$STRIP_PATHS"
          git rm -r --quiet --ignore-unmatch -- "${STRIP[@]}"
          # Remove root feedback/handover md files by pattern.
          # REV-01: root-anchored with [^/]* — previous '^.*_FEEDBACK.*\.md$' over-matched
          # paths at ANY depth (e.g. kleros-curate/MIGRATION_FEEDBACK.md), which would
          # silently delete legitimate skill-dir docs from user installs.
          # 2026-06-11 fix: dropped the leading underscore requirement — earlier
          # '_FEEDBACK' pattern missed files like FEEDBACK_FROM_CLAUDE_MARKETPLACE.md
          # where FEEDBACK is at position 0. Sanity check below was also broadened.
          # `|| true`: steps run under `bash -e -o pipefail`, and grep exits 1
          # when nothing matches, which would fail the release once dev has no
          # root scratch files left.
          git ls-files -z | \
            { grep -zE "$STRIP_ROOT_PATTERN" || true; } | \
            xargs -0 --no-run-if-empty git rm --quiet --
          echo "Strip complete. Remaining tracked files:"
          git ls-files | head -60

      # -----------------------------------------------------------------------
      # REV-09: Sanity check the stripped tree before committing.
      # Catches both over-strip (keep-list path disappeared) and under-strip
      # (strip-list path survived). Cheap insurance against future strip-list
      # edits that go wrong.
      # -----------------------------------------------------------------------
      - name: Sanity check stripped tree
        run: |
          # REV-16 principle fix (2026-06-11): allowlist-based assertion replaces
          # predicate-symmetric ABSENT checks. Catches under-strip AND any future
          # scratch-pattern (BUGFIX_NOTES.md, DRAFT_v2.md, etc.) automatically,
          # instead of requiring a workflow edit per new pattern. The check is
          # orthogonal to the strip step's predicate — if the strip's pattern is
          # wrong, this allowlist still fails-loud.
          #
          # MAINTENANCE CONTRACT: every legitimate new root file or directory must
          # be added to EXPECTED_ROOT below. CI will fail-loud until it is.
          # See 260607-w84-REVIEW.md REV-16 for the engineering rationale.
          # printf '%s\n' (not heredoc) — heredoc closing EOF must sit at
          # column 0, which violates YAML's run-block indentation rule and
          # makes GitHub refuse to parse the workflow. printf+continuations
          # are valid YAML *and* valid bash.
          EXPECTED_ROOT=$(printf '%s\n' \
            .git .claude .claude-plugin .github .gitignore .well-known \
            apple-touch-icon.png CHANGELOG.md CLAUDE.md \
            favicon-16x16.png favicon-32x32.png favicon.ico favicon.svg \
            feedback index.html kleros-create-dispute kleros-curate \
            kleros-ipfs-upload LICENSE \
            netlify netlify.toml openclaw-skill README.md robots.txt \
            sitemap.xml SKILL.md | sort)
          ACTUAL_ROOT=$(ls -A1 | sort)
          UNEXPECTED=$(comm -23 <(echo "$ACTUAL_ROOT") <(echo "$EXPECTED_ROOT"))
          if [ -n "$UNEXPECTED" ]; then
            echo "FATAL: unexpected root entries after strip:"
            echo "$UNEXPECTED"
            echo ""
            echo "If intentional: add the entry to EXPECTED_ROOT in sync-master.yml and re-run."
            echo "If accidental: extend the strip-list or fix the source on dev."
            exit 1
          fi
          # keep-list assertions — must be PRESENT (catches strip overreach)
          for path in kleros-create-dispute kleros-curate kleros-ipfs-upload \
                      feedback .well-known/agent-skills \
                      .github/workflows SKILL.md index.html README.md LICENSE \
                      CHANGELOG.md robots.txt sitemap.xml; do
            if [ ! -e "$path" ]; then
              echo "FATAL: keep-list path '$path' missing after strip — overreach"
              exit 1
            fi
          done
          echo "OK: stripped tree looks correct."

      # -----------------------------------------------------------------------
      # 3. Mint a short-lived GitHub App installation token (auto-revoked at job end).
      #    App must be registered in the kleros org, scoped to this repo only,
      #    with Contents: Read and write.  No other permissions needed.
      #    Minted as late as possible: after every check, right before the push,
      #    and only ever exposed to the push step below (never to checkout or
      #    .git/config).
      #
      #    SHA-pinned (REV-02): this Action sees GH_APP_PRIVATE_KEY as input.
      #    A mutable @v2 tag would let a compromised release exfiltrate the PEM.
      #    Update the pin alongside any deliberate version bump.
      # -----------------------------------------------------------------------
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          # client-id (not app-id) per action v3.1.0+ deprecation.
          # Inlined because client-id is a non-sensitive identifier (visible
          # on the App's public page); only the private key is a real secret.
          client-id: Iv23liKuhygE4qmFei7w
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # -----------------------------------------------------------------------
      # 4. Configure git identity for the bot commit on master.
      #    REV-11: identity derived dynamically from the App token output.
      #    Whatever name the user registered the App with (e.g. kleros-skills-bot
      #    or kleros-sync), the commit author will match the actual App slug —
      #    no hardcoded string to drift out of sync.
      # -----------------------------------------------------------------------
      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      # 5. Commit the stripped tree (no token in this step's environment), then
      #    push it to master.
      #    --force-with-lease rejects the push if someone pushed to master
      #    since the checkout fetched origin/master (safer than --force).
      #    The commit is created even when deletions are the only changes.
      #
      #    Token handoff: the App token reaches git only through a one-shot
      #    credential helper on this command line (`-c`, nothing written to
      #    .git/config). The helper reads $GH_APP_TOKEN from the environment
      #    at runtime, so the token never appears in argv or the log; the
      #    action registers it as a masked secret. `credential.helper=` first
      #    clears any inherited helper; the helper answers only for github.com.
      # -----------------------------------------------------------------------
      - name: Commit stripped tree
        run: |
          git commit -m "chore(master): sync from dev (strip dev-only files)"

      - name: Push to master
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git -c credential.helper= \
              -c 'credential.helper=!f() { test "$1" = get || exit 0; grep -qx host=github.com || exit 0; echo username=x-access-token; echo "password=${GH_APP_TOKEN}"; }; f' \
              push origin HEAD:master --force-with-lease
