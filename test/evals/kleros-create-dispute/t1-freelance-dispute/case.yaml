# claude plugin eval case — see test/evals/README.md. Paid to run; never part of `npm test`.
schema_version: "1.1"
name: kleros-create-dispute/t1-freelance-dispute
description: >-
  Trigger case: kleros-create-dispute should fire. Read-only tools only.
tags: [trigger, kleros-create-dispute]
plugins: ["../../../.."]
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    I paid a freelance designer 0.3 ETH up front for a logo and they never delivered. Can you take this freelance payment dispute to Kleros?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kleros-create-dispute"'
  # Skill-discriminating: the no-plugin baseline also talks about policy/jurors, so require
  # the skill's own route and steps, not generic Kleros vocabulary.
  - name: skill-workflow
    type: llm
    criteria: |
      PASS if the reply starts the kleros-create-dispute workflow for a standalone Kleros V2 dispute and shows at least three of these four skill-specific elements:
      (1) the route is the Kleros V2 DisputeResolver / createDisputeForTemplate on Arbitrum (One for a real ruling);
      (2) a written policy document is needed as an /ipfs/ CID, uploaded through the paid Kleros IPFS upload (x402, Base USDC) with the user's approval of the price;
      (3) it offers or recommends a rehearsal on Arbitrum Sepolia before spending mainnet ETH;
      (4) it says the case file is checked and priced by the skill's helper (validate / preflight, live arbitration fee) and nothing is signed or sent without the user's explicit approval.
      Asking the user for the juror question, answer options, facts or wallet is fine and expected.
      FAIL if it only gives generic guidance (e.g. use Kleros Escrow, go to the Kleros website, explain how Kleros works), invents contract addresses, fees or CIDs, or claims a dispute was created.
