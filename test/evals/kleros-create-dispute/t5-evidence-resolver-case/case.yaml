# claude plugin eval case — see test/evals/README.md. Paid to run; never part of `npm test`.
schema_version: "1.1"
name: kleros-create-dispute/t5-evidence-resolver-case
description: >-
  Trigger case: kleros-create-dispute should fire. Read-only tools only.
tags: [trigger, kleros-create-dispute]
plugins: ["../../../.."]
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Add evidence to the Kleros case I created via the DisputeResolver on Arbitrum Sepolia, creation tx 0x1fc6eee9bb2eb3f1adcc27bd8c69f30d51c3324c61268c110331fe4befb4f59e.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kleros-create-dispute"'
  # Skill-discriminating (judge, not regex): a correct with-skill reply may ask for the
  # evidence content before naming the helper command, so a literal "--creation-tx"
  # regex was flaky (0/3 in the 2026-11-05 full run while behaving correctly).
  - name: chain-derived-group
    type: llm
    criteria: |
      PASS only if the reply shows element (2) AND at least one of (1) or (3):
      (1) it asks for (or drafts) the evidence document fields — a name and a description, with an optional attached file uploaded to IPFS first;
      (2) it says the evidence group / key is read from the chain (from the creation transaction or the resolver) by the skill's helper, and is not typed, guessed, or assumed equal to the case number;
      (3) it says the evidence transaction is prepared for the user's wallet and only sent after the user's explicit approval, unchanged.
      FAIL if it states or uses a specific evidence-group number it did not read from the chain, or if it offers only generic advice (e.g. "call submitEvidence on the arbitrable" or "use the Court UI") without any of the above.
