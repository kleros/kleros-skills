# claude plugin eval case — see test/evals/README.md. Paid to run; never part of `npm test`.
schema_version: "1.1"
name: kleros-create-dispute/n1-fund-appeal
description: >-
  Should-not-fire case: kleros-create-dispute must stay silent. Read-only tools only.
tags: [trigger, kleros-create-dispute]
plugins: ["../../../.."]
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    I want to fund an appeal for Kleros case 1234 — how do I do it?
graders:
  - name: create-dispute-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kleros-create-dispute"'
    min: 0
    max: 0
    arm: both
  - name: no-new-dispute
    type: llm
    criteria: |
      PASS if the reply addresses funding an appeal on the existing case and does not propose creating a new dispute.
      FAIL if it suggests opening/creating a new Kleros dispute (e.g. createDisputeForTemplate, DisputeResolver) as the way to appeal.
