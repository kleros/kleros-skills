# claude plugin eval case — see test/evals/README.md. Paid to run; never part of `npm test`.
schema_version: "1.1"
name: kleros-create-dispute/t3-extradata
description: >-
  Trigger case: kleros-create-dispute should fire. Read-only tools only.
tags: [trigger, kleros-create-dispute]
plugins: ["../../../.."]
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    What extraData do I pass to createDisputeForTemplate for court 1 with 3 jurors?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kleros-create-dispute"'
  - name: abi-encoded-via-helper
    type: llm
    criteria: |
      PASS if the reply says the extra data is the ABI encoding of (uint256 courtId, uint256 minJurors, uint256 disputeKitId) with court 1, 3 jurors and dispute kit 1, and points to the skill's helper (validate/preflight) to produce or verify the encoding rather than hand-building transaction calldata.
      FAIL if it gives a different layout or dispute kit, or tells the user to hand-assemble and send their own calldata.
