# claude plugin eval case — see test/evals/README.md. Paid to run; never part of `npm test`.
schema_version: "1.1"
name: kleros-create-dispute/n3-curate-challenge
description: >-
  Should-not-fire case: kleros-create-dispute must stay silent. Read-only tools only.
tags: [trigger, kleros-create-dispute]
plugins: ["../../../.."]
runs: 3
execution:
  max_turns: 6
  timeout_seconds: 180
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: |
    Challenge this item on the Kleros Curate token list — the logo is wrong.
graders:
  - name: create-dispute-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kleros-create-dispute"'
    min: 0
    max: 0
    arm: both
  - name: kleros-curate-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kleros-curate"'
    arm: both
  - name: talks-challenge
    type: regex
    pattern: 'challeng'
    flags: i
